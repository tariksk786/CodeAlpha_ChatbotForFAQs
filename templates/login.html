<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | FAQ Whisperer AI</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

    <!-- Background Blobs -->
    <div class="blob-container">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4" style="max-width: 440px;">
                
                <!-- Back arrow to home -->
                <div class="mb-4">
                    <a href="/" class="text-decoration-none text-muted small hover-text-white transition-smooth">
                        <i class="fas fa-arrow-left me-1"></i> Back to Landing Page
                    </a>
                </div>
                
                <!-- Login Glass Card -->
                <div class="glass-card p-5 fade-in-up">
                    <div class="text-center mb-5">
                        <div class="feature-icon-wrapper mx-auto mb-3">
                            <i class="fas fa-lock"></i>
                        </div>
                        <h3 class="fw-bold">Admin Portal</h3>
                        <p class="text-muted small">Sign in with administrator credentials</p>
                    </div>

                    <form id="login-form">
                        <!-- Username -->
                        <div class="mb-4">
                            <label for="username" class="form-label small text-muted fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-light border-opacity-10 text-muted">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" id="username" class="form-control form-glass-input border-start-0" placeholder="admin" required autocomplete="off">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label small text-muted fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-light border-opacity-10 text-muted">
                                    <i class="fas fa-key"></i>
                                </span>
                                <input type="password" id="password" class="form-control form-glass-input border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid mt-5">
                            <button type="submit" id="btn-submit" class="btn btn-glass-primary glow-on-hover py-3">
                                Sign In <i class="fas fa-sign-in-alt ms-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Notice details -->
                <div class="text-center mt-4 text-muted small">
                    <i class="fas fa-info-circle me-1"></i> Default credentials can be set inside <code>config.py</code>.
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- AJAX Form Submit -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btn-submit');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
            btnSubmit.disabled = true;

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => {
                if (res.status === 401) {
                    throw new Error("Invalid username or password credentials.");
                }
                if (!res.ok) {
                    throw new Error("HTTP error code " + res.status);
                }
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        title: 'Authenticated!',
                        text: 'Welcome to the Admin Dashboard.',
                        icon: 'success',
                        timer: 1000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = data.redirect_url;
                    });
                } else {
                    throw new Error(data.error || "Authentication failed.");
                }
            })
            .catch(err => {
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
                
                Swal.fire({
                    title: 'Login Failed',
                    text: err.message,
                    icon: 'error',
                    confirmButtonColor: '#4F46E5'
                });
            });
        });
    </script>
</body>
</html>
