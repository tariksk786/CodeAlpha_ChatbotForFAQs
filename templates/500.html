<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error | FAQ Whisperer AI</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

    <!-- Background Blobs -->
    <div class="blob-container">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2" style="opacity: 0.1;"></div>
    </div>

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- 500 Glass Card -->
                <div class="glass-card p-5 fade-in-up">
                    <div class="feature-icon-wrapper mx-auto mb-4" style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(124, 58, 237, 0.2)); color: #FCA5A5;">
                        <i class="fas fa-bug"></i>
                    </div>
                    
                    <h1 class="display-1 fw-bold text-gradient mb-2">500</h1>
                    <h3 class="fw-bold mb-3">Internal Server Error</h3>
                    <p class="text-muted mb-5">
                        Something went wrong on our end. The server encountered an error while processing the request. Please reload or check back in a few minutes.
                    </p>
                    
                    <div class="d-grid gap-3">
                        <a href="/" class="btn btn-glass-primary py-3">
                            <i class="fas fa-home me-2"></i> Return to Homepage
                        </a>
                        <button onclick="window.location.reload();" class="btn btn-glass-secondary py-3">
                            <i class="fas fa-sync-alt me-2"></i> Reload Page
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
